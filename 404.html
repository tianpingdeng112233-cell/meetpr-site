<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · MeetPR</title>
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1d21;
    --fg-secondary: #52565e;
    --fg-muted: #7a7f88;
    --accent: #1f4b73;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eceef1;
      --fg-secondary: #b3b8c0;
      --fg-muted: #868c96;
      --accent: #8fb8dd;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg); padding: 24px;
    font: 400 17px/1.7 -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          Arial, sans-serif;
  }
  main { max-width: 440px; }
  .code {
    font-size: 13px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-muted); margin: 0 0 14px;
  }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 12px; letter-spacing: -0.015em; }
  p { color: var(--fg-secondary); margin: 0 0 22px; }
  a { color: var(--accent); text-underline-offset: 3px; }
  .links { font-size: 15px; color: var(--fg-muted); }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>That page is not here.</h1>
  <p>The link may be out of date, or the address may have a typo in it.</p>
  <p class="links">
    <a href="/">Home</a> ·
    <a href="/privacy/en">Privacy Policy</a> ·
    <a href="/privacy">隐私政策(中文)</a>
  </p>
</main>
</body>
</html>
