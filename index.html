<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1d21; --fg2:#52565e; --accent:#1f4b73; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#eceef1; --fg2:#b3b8c0; --accent:#8fb8dd; }
  }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); padding:24px;
    font:400 17px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC",
         "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width:420px; text-align:center; }
  h1 { font-size:32px; margin:0 0 10px; letter-spacing:-0.01em; }
  p { color:var(--fg2); margin:0 0 26px; }
  a { color:var(--accent); text-underline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>MeetPR</h1>
