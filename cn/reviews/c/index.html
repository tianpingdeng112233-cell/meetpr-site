<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>const p=location.pathname;const b=document.createElement("base");b.href=p.slice(0,p.indexOf("/reviews")+8)+"/";document.head.append(b);</script>
<title>力量举教练点评</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/coach.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/report.css">
</head>
<body data-page="coach">
<header class="bar">
  <a class="back bar__lead" href="coaches/">← BACK</a>
  <a class="bar__logo" href="./"><b>力量举教练点评</b><small>POWERLIFTING COACH REVIEWS</small></a>
  <nav aria-label="主导航"><a href="./">首页</a><a class="on" href="coaches/">全部教练</a><a href="./#map">教练分布</a><a data-policy="rules" href="#">点评规则</a></nav>
  <div class="bar__actions"><a class="btn btn--dark" href="login/">登录</a><a class="btn btn--solid" href="write/">写点评</a></div>
</header>

<section class="band" aria-labelledby="coach-h" style="padding-top: 88px;">
  <img class="band__photo" src="assets/img/squat.jpg" alt="" aria-hidden="true" style="object-position: 60% 30%">
  <div class="dots" aria-hidden="true"></div>
  <div class="wrap profile" id="coach-profile"><h1 id="coach-h">正在加载</h1></div></section>

<section class="body">
  <div class="wrap">
    <div class="grid2">
      <div class="panel">
        <span class="tag">SCORES // 四项平均</span>
        <div class="subs"></div></div><div class="panel">
        <span class="tag">PROFILE // 资料</span>
        <dl class="facts"></dl>
      </div>
    </div>

    <div class="reviews-head">
      <div><span class="tag">REVIEWS</span><h2>学员点评</h2></div>
      <div class="filters"><button type="button" class="on">最新</button><button type="button">分数从高到低</button></div>
    </div>

    
    
    

    <div id="review-list" aria-live="polite"></div><p class="takedown contact" hidden></p>
  </div>
</section>

<footer class="foot">
  <div><b>力量举教练点评</b><small>© 2026 POWERLIFTING COACH REVIEWS</small></div>
  <nav aria-label="页脚"><a href="submit/">提交教练</a><a data-policy="rules" href="#">点评规则</a><a data-policy="privacy" href="#">隐私</a><span class="contact" hidden></span></nav>
</footer>
<dialog id="report-dialog"><form class="sheet" aria-labelledby="r-h">
    <div class="sheet__head">
      <div><span class="tag">REPORT // 举报</span><h1 id="r-h">举报这条点评</h1></div>
      <button class="close" type="button" aria-label="关闭">✕</button>
    </div>
    <p class="quote"></p>
    <fieldset class="reasons" style="border:0;margin:0;padding:0;">
      <legend class="tag tag--grey" style="margin-bottom:6px;">选一个理由</legend>
      <label><input type="radio" name="r" checked>辱骂、人身攻击</label>
      <label><input type="radio" name="r">泄露隐私</label>
      <label><input type="radio" name="r">虚假内容或广告</label>
      <label><input type="radio" name="r">其他</label>
    </fieldset>
    <label class="field"><span>补充说明（选填）</span><textarea class="input" rows="3"></textarea></label>
    <p class="fine">举报后这条点评会照常显示，管理员 3 天内处理。</p>
    <button class="btn btn--solid btn--block" type="submit">提交举报</button>
  </form></dialog>
<script type="module" src="assets/app.js"></script>
</body>
</html>
