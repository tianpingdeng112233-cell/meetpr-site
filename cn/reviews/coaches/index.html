<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>const p=location.pathname;const b=document.createElement("base");b.href=p.slice(0,p.indexOf("/reviews")+8)+"/";document.head.append(b);</script>
<title>力量举教练点评</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/list.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="list">
<header class="bar">
  <button class="back bar__lead" type="button" aria-label="搜索教练" style="background:none;border:0;color:#fff;width:44px;justify-content:center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
  </button>
  <a class="bar__logo" href="./"><b>力量举教练点评</b><small>POWERLIFTING COACH REVIEWS</small></a>
  <nav aria-label="主导航"><a href="./">首页</a><a class="on" href="coaches/">全部教练</a><a href="./#map">教练分布</a><a data-policy="rules" href="#">点评规则</a></nav>
  <div class="bar__actions"><a class="btn btn--dark" href="login/">登录</a><a class="btn btn--solid" href="write/">写点评</a></div>
</header>

<section class="band" aria-labelledby="list-h">
  <img class="band__photo" src="assets/img/hall.jpg" alt="" aria-hidden="true" style="object-position: 40% 40%">
  <div class="dots" aria-hidden="true"></div>
  <div class="wrap list-head">
    <div>
      <span class="tag">COACH ROSTER // ALL</span>
      <h1 id="list-h" class="huge">全部力量举教练</h1>
    </div>
    <form class="search" role="search">
      <div class="search__tabs" role="tablist" aria-label="查询方式">
        <button type="button" role="tab" aria-selected="false">按城市</button>
        <button type="button" role="tab" aria-selected="true" class="on">按名字 / 网名</button>
      </div>
      <div class="search__bar">
        <label><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9b9b9b" stroke-width="2.2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input type="search" placeholder="输入教练名字或网名" aria-label="输入教练名字或网名"></label>
        <button type="submit">找教练</button>
      </div>
    </form>
  </div>
</section>

<section class="roster" aria-label="教练名单">
  <div class="wrap">
    <div class="list-tools">
      <div class="filters">
        <select aria-label="省份"><option>全部省份</option><option>广东</option></select>
        <select aria-label="城市"><option>全部城市</option></select>
        <button type="button" class="on">全部</button><button type="button">线下</button><button type="button">线上</button><button type="button">线上+线下</button>
      </div>
    </div>
    <div class="list-meta"><span class="tag tag--grey">正在加载</span><span class="tag tag--grey">按点评数排</span></div>
    <div class="group"><span class="tag">MOST REVIEWED // 点评最多</span></div>
    
    
    
    
    
    
    
    
    
    <div id="coach-list" aria-live="polite"></div><button class="more" id="load-more" hidden>LOAD MORE →</button>

    <div class="submit-row">
      <div><b>列表里没有你想找的教练？</b><p>提交他的名字、抖音号和城市，管理员审核后上线。</p></div>
      <a class="btn btn--dark" href="submit/">提交一位教练</a>
    </div>
  </div>
</section>

<footer class="foot">
  <div><b>力量举教练点评</b><small>© 2026 POWERLIFTING COACH REVIEWS</small></div>
  <nav aria-label="页脚"><a href="submit/">提交教练</a><a data-policy="rules" href="#">点评规则</a><a data-policy="privacy" href="#">隐私</a><span class="contact" hidden></span></nav>
</footer>
<script type="module" src="assets/app.js"></script>
</body>
</html>
